<html lang="en">

  <style>
/* ── Custom Fonts ─────────────────────────────────────── */
@font-face {
  font-family: 'AkzidGroSt';
  src: url('fonts/AkzidGroStdBol.otf') format('opentype');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'AkzidGroSt';
  src: url('fonts/AkzidGroStdReg.otf') format('opentype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'AkzidGroSt';
  src: url('fonts/AkzidGroStdLig.otf') format('opentype');
  font-weight: 300;
  font-display: swap;
}
@font-face {
  font-family: 'AkzidGroSt';
  src: url('fonts/AkzidGroStdLigIta.otf') format('opentype');
  font-weight: 300;
  font-style: italic;
  font-display: swap;
}

/* ── Variables ────────────────────────────────────────── */
:root {
  --black:  #000000;
  --off:    #000000;
  --dark:   #1C1C1C;
  --white:  #F2EDE8;
  --muted:  rgba(242, 237, 232, 0.842);
  --faint:  rgba(242,237,232,0.10);
  --border: rgba(242,237,232,0.10);
  --font:   'AkzidGroSt', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ease:   cubic-bezier(0.16,1,0.3,1);
  --soft:   cubic-bezier(0.25,0.46,0.45,0.94);
  --fast:   0.25s ease;
  --mid:    0.5s var(--soft);
  --slow:   0.8s var(--soft);
}


/* ── Reset ────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: #ffffff;
  color: #000000;
  overflow-x: hidden;
  cursor: none;
  -webkit-font-smoothing: antialiased;
}
img  { display: block; max-width: 100%; }
a    { text-decoration: none; color: inherit; }
button { font-family: var(--font); cursor: none; border: none; outline: none; }
input, textarea, select { font-family: var(--font); outline: none; }

/* ── Page Loader ──────────────────────────────────────── */
#page-loader {
  position: fixed; inset: 0; z-index: 100000;
  background: #ffffff;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 1s var(--ease), visibility 1s;
}
#page-loader.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.ld-scene {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  width: 6px; height: 6px;
}
.ld-dot {
  width: 6px; height: 6px;
  background: #000;
  border-radius: 50%;
  position: relative; z-index: 2;
  flex-shrink: 0;
}
.ld-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 32px; height: 32px;
  margin: -16px 0 0 -16px;
  border: 1px solid rgba(0,0,0,0.4);
  border-radius: 50%;
  opacity: 0;
  animation: ldRipple 2.4s cubic-bezier(0.16,1,0.3,1) infinite;
}
.ld-ring:nth-child(2) { animation-delay: 0s; }
.ld-ring:nth-child(3) { animation-delay: 0.8s; }
.ld-ring:nth-child(4) { animation-delay: 1.6s; }
@keyframes ldRipple {
  0%   { transform: scale(1);   opacity: 0.6; }
  75%  { transform: scale(5.5); opacity: 0;   }
  100% { transform: scale(5.5); opacity: 0;   }
}

/* ── Custom Cursor ────────────────────────────────────── */
.c-dot {
  position: fixed; z-index: 99999;
  width: 5px; height: 5px;
  background: #000000;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s, background 0.2s;
}
.c-ring {
  position: fixed; z-index: 99998;
  width: 32px; height: 32px;
  border: 1px solid rgba(0,0,0,0.35);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: width 0.35s var(--ease), height 0.35s var(--ease), border-color 0.35s;
}
body.c-hover .c-ring { width: 64px; height: 64px; border-color: rgba(0,0,0,0.15); }
body.c-click .c-dot  { width: 8px; height: 8px; }

/* ── Navigation ───────────────────────────────────────── */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: 72px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
  background: #ffffff;
  border-bottom: 1px solid #e0e0e0;
}
.nav-logo {
  font-family: var(--font);
  font-size: 18px;
  font-weight: 700;
  color: #000;
  letter-spacing: -0.01em;
  opacity: 1;
  transition: opacity var(--fast);
  display: flex;
  align-items: center;
  gap: 2px;
}
.nav-logo:hover { opacity: 0.6; }
.nav-logo-img { height: auto; width: 160px; display: block; }

.nav-actions { display: flex; align-items: center; gap: 28px; }
.nav-search-btn {
  background: none; padding: 0; color: #000;
  display: flex; align-items: center;
  transition: opacity var(--fast);
}
.nav-search-btn:hover { opacity: 0.5; }
.nav-search-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }

.nav-hamburger {
  display: flex; flex-direction: column; gap: 5px;
  background: none; padding: 0;
}
.nav-hamburger span {
  display: block; width: 22px; height: 1.5px;
  background: #000;
  transition: transform 0.3s var(--ease), opacity 0.3s;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* ── Mobile Menu ──────────────────────────────────────── */
.mob-menu {
  position: fixed; inset: 0; z-index: 800;
  background: #ffffff;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
.mob-menu.open { opacity: 1; pointer-events: all; }
.mob-menu ul { list-style: none; text-align: center; }
.mob-menu ul li { overflow: hidden; margin-bottom: 8px; }
.mob-menu ul a {
  display: block;
  font-size: clamp(22px, 4.5vw, 42px);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: -0.02em; color: #000;
  transform: translateY(110%);
  transition: transform 0.7s var(--ease), color var(--fast);
  line-height: 1.1;
}
.mob-menu.open ul a { transform: translateY(0); }
.mob-menu ul a:hover { color: rgba(0,0,0,0.45); }
.mob-menu ul li:nth-child(1) a { transition-delay: 0.05s; }
.mob-menu ul li:nth-child(2) a { transition-delay: 0.10s; }
.mob-menu ul li:nth-child(3) a { transition-delay: 0.15s; }
.mob-menu ul li:nth-child(4) a { transition-delay: 0.20s; }
.mob-menu ul li:nth-child(5) a { transition-delay: 0.25s; }

/* ── Search Overlay ───────────────────────────────────── */
.search-overlay {
  position: fixed; inset: 0; z-index: 950;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(24px);
  display: flex; flex-direction: column;
  padding: 120px 48px 60px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.search-overlay.open { opacity: 1; pointer-events: all; }
.search-wrap {
  display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid #e0e0e0; padding-bottom: 24px; margin-bottom: 40px;
}
.search-wrap svg { width: 20px; height: 20px; stroke: rgba(0,0,0,0.4); fill: none; stroke-width: 1.75; flex-shrink: 0; }
#searchInput {
  flex: 1; background: none; border: none;
  font-size: clamp(20px, 3.5vw, 40px); font-weight: 300;
  letter-spacing: -0.02em; color: #000;
  caret-color: #000;
}
#searchInput::placeholder { color: rgba(0,0,0,0.2); }
.search-esc {
  background: none; border: 1px solid #e0e0e0;
  color: rgba(0,0,0,0.5); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; padding: 8px 14px;
  transition: color var(--fast), border-color var(--fast);
}
.search-esc:hover { color: #000; border-color: rgba(0,0,0,0.4); }

/* ════════════════════════════════════════════
   NEWS PAGE — white background layout
════════════════════════════════════════════ */

/* ── Page Header ─────────────────────────── */
.news-page-header {
  margin-top: 72px;
  padding: 48px 59px 32px 59px;
  background: #ffffff;
}
.news-page-title {
  font-family: var(--font);
  font-size: clamp(28px, 3.5vw, 42px);
  font-weight: 300;
  font-stretch: normal;
  letter-spacing: -0.01em;
  color: #000000;
  line-height: 1.1;
}

/* ── Filter Bar ──────────────────────────── */
.news-filter-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 59px 0 59px;
  background: #ffffff;
  margin-bottom: 0;
}

/* Search input */
.news-search-wrap {
  flex: 1;
  position: relative;
}
.news-search-input {
  width: 100%;
  background: #f2f2f2;
  border: 1px solid #e8e8e8;
  border-radius: 36px;
  padding: 13px 20px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 400;
  color: #888888;
  transition: border-color var(--fast);
}
.news-search-input::placeholder {
  color: #aaaaaa;
}
.news-search-input:focus {
  border-color: #ccc;
  color: #000;
  outline: none;
}

/* Types dropdown */
.news-types-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.news-types-select {
  background: #f2f2f2;
  border: 1px solid #e8e8e8;
  border-radius: 36px;
  padding: 13px 52px 13px 20px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 400;
  color: #888888;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  min-width: 360px;
  transition: border-color var(--fast);
}
.news-types-select:focus {
  border-color: #ccc;
  outline: none;
}
.news-types-select option {
  background: #ffffff;
  color: #000;
}
.news-types-arrow-wrap {
  position: absolute;
  right: 14px;
  pointer-events: none;
  width: 26px;
  height: 26px;
  border: 1px solid #d0d0d0;
  border-radius: 50%;
  /* background: #ffffff; */
  display: flex;
  align-items: center;
  justify-content: center;
}
.news-types-arrow {
  width: 13px;
  height: 13px;
  stroke: #888;
  fill: none;
  stroke-width: 2;
}

/* ── Divider after filter ─────────────────── */
.news-divider {
  height: 1px;
  background: #6e6e6e;
  margin: 28px 59px 0 59px;
}

/* ── News List ───────────────────────────── */
.news-list {
  padding: 0 59px;
  background: #ffffff;
}

/* Each article row */
.news-row {
  display: flex;
  align-items: flex-start;
  gap: 48px;
  padding: 48px 0;
  border-bottom: 1px solid #6e6e6e;
  text-decoration: none;
  color: inherit;
  transition: opacity 0.2s ease;
}
.news-row:hover { opacity: 0.8; }
.news-row:first-child {
  border-top: none;
}

/* Image side */
.news-row-img {
  flex-shrink: 0;
    width: 468px;
    height: 260px;
  overflow: hidden;
  border-radius: 2px;
  background: #f0f0f0;
}
.news-row-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.7s var(--soft);
}
.news-row:hover .news-row-img img {
  transform: scale(1.04);
}

/* Text side */
.news-row-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 4px;
}

.news-row-cat {
font-family: var(--font);
    font-size: 13px;
    font-weight: 900;
    color: black;
    letter-spacing: 0;
    margin-bottom: 10px;
}

.news-row-title {
  font-family: var(--font);
  font-size: clamp(22px, 2.5vw, 34px);
  font-weight: 300;
  letter-spacing: -0.02em;
  color: #000000;
  line-height: 1.15;
  margin-bottom: 6px;
}

.news-row-meta {
font-family: var(--font);
    font-size: 18px;
    font-weight: 300;
    color: #959595;
    letter-spacing: 0;
    margin-bottom: 8px;

}

.news-row-excerpt {
font-family: var(--font);
    font-size: 18px;
    font-weight: 400;
    line-height: 1.7;
    color: #464646;
    margin-bottom: 10px;
    max-width: 700px;
}

.news-read-btn {
  display: inline-block;
  padding: 12px 40px;
  /* border: 1px solid #cccccc; */
  border-radius: 24px;
  background: #f2f2f2;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 400;
  color: #888888;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  width: fit-content;
}
.news-row:hover .news-read-btn {
  border-color: #888;
  color: #555;
}


/* ── Responsive ───────────────────────────────────────── */
@media (max-width: 1200px) {
  .news-row-img { width: 360px; height: 210px; }
}
@media (max-width: 1024px) {
  .news-row-img { width: 300px; height: 190px; }
  .news-row-title { font-size: clamp(20px, 2.2vw, 28px); }
  #newsletter { gap: 48px; }
}
@media (max-width: 860px) {
  .news-row-img { width: 260px; height: 175px; }
  .news-row { gap: 32px; }
  .f-top-row { flex-wrap: wrap; gap: 20px; }
}
@media (max-width: 768px) {
  /* Nav */
  #nav { padding: 0 20px; height: 60px; }

  /* Page header */
  .news-page-header { padding: 36px 20px 20px; margin-top: 60px; }
  .news-page-title { font-size: clamp(22px, 5vw, 32px); }

  /* Filter bar */
  .news-filter-bar { padding: 0 20px; flex-direction: column; align-items: stretch; gap: 12px; }
  .news-search-input { font-size: 14px; padding: 12px 16px; }
  .news-types-select { min-width: 100%; font-size: 14px; padding: 12px 44px 12px 16px; }
  .news-divider { margin: 20px 20px 0; }

  /* News list */
  .news-list { padding: 0 20px; }
  .news-row {
    flex-direction: column;
    gap: 16px;
    padding: 28px 0;
  }
  .news-row-img {
    width: 100%;
    height: 230px;
    border-radius: 2px;
  }
  .news-row-title { font-size: clamp(18px, 4vw, 24px); margin-bottom: 8px; }
  .news-row-cat { font-size: 12px; margin-bottom: 6px; }
  .news-row-meta { font-size: 12px; margin-bottom: 12px; }
  .news-row-excerpt { font-size: 13px; margin-bottom: 18px; }
  .news-read-btn { padding: 9px 20px; font-size: 12px; }

  /* Newsletter */
  #newsletter {
    grid-template-columns: 1fr;
    gap: 28px;
    padding: 52px 20px 48px;
  }
  .nl-head { font-size: clamp(20px, 5vw, 28px); max-width: 100%; }
  .nl-input { font-size: 15px; padding: 15px 18px; }
  .nl-btn { font-size: 15px; margin-top: 18px; }

  /* Footer */
  footer { padding: 32px 20px 36px; }
  .f-top-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
    padding-bottom: 24px;
    margin-bottom: 20px;
  }
  .f-bottom-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .f-nav-row { gap: 16px; flex-wrap: wrap; }
  .f-nav-row a { font-size: 13px; }
  .f-copy { font-size: 12px; }
}
@media (max-width: 480px) {
  .news-page-title { font-size: 22px; }
  .news-row-title { font-size: 18px; }
  .news-row-img { height: 200px; }
  .f-nav-row { gap: 12px; }
  .f-nav-row a { font-size: 12px; }
  #newsletter { padding: 44px 16px 40px; }
  .news-list { padding: 0 16px; }
  .news-page-header { padding: 32px 16px 16px; }
  .news-filter-bar { padding: 0 16px; }
  .news-divider { margin: 16px 16px 0; }
}
  </style>
</head>

  <!-- ── Scripts ── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="projects-data.js"></script>
  <script>
  (async function(){
  await loadProjects();
  /* ── Cursor ── */
  const dot = document.getElementById('cDot'), ring = document.getElementById('cRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px'; dot.style.top = my + 'px';
  });
  document.addEventListener('mousedown', () => document.body.classList.add('c-click'));
  document.addEventListener('mouseup',   () => document.body.classList.remove('c-click'));
  (function loop() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(loop);
  })();
  function addHover(el) {
    el.addEventListener('mouseenter', () => document.body.classList.add('c-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('c-hover'));
  }
  document.querySelectorAll('a, button').forEach(addHover);

  /* ── Nav scroll ── */
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.style.borderBottomColor = window.scrollY > 10 ? '#e0e0e0' : '#e0e0e0';
  }, { passive: true });

  /* ── Hamburger / mobile menu ── */
  const hamBtn = document.getElementById('hamBtn'), mobMenu = document.getElementById('mobMenu');
  let mobOpen = false;
  function closeMob() { mobOpen = false; hamBtn.classList.remove('open'); mobMenu.classList.remove('open'); document.body.style.overflow = ''; }
  hamBtn.addEventListener('click', () => {
    mobOpen = !mobOpen;
    hamBtn.classList.toggle('open', mobOpen);
    mobMenu.classList.toggle('open', mobOpen);
    document.body.style.overflow = mobOpen ? 'hidden' : '';
  });
  document.querySelectorAll('.mob-lnk').forEach(a => a.addEventListener('click', closeMob));

  /* ── Search overlay ── */
  const so = document.getElementById('searchOverlay'),
        sb = document.getElementById('searchBtn'),
        sc = document.getElementById('searchClose'),
        si = document.getElementById('searchInput'),
        sr = document.getElementById('searchResults');
  function openSearch() { closeMob(); so.classList.add('open'); document.body.style.overflow = 'hidden'; setTimeout(() => si.focus(), 60); }
  function closeSearch() { so.classList.remove('open'); document.body.style.overflow = ''; si.value = ''; }
  sb.addEventListener('click', openSearch);
  sc.addEventListener('click', closeSearch);
  so.addEventListener('click', e => { if (e.target === so) closeSearch(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSearch();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  });

  /* ── News data ── */
  const NEWS = [
    {
      cat: 'Award',
      title: 'Magg+Partners Wins RIBA Award 2024',
      date: 'March 2024',
      readTime: '5 minute read',
      excerpt: 'Recognised for outstanding contribution to residential architecture in the MENA region, the award highlights our commitment to innovative and contextual design.',
      img: 'assets/assets/02_Projects/2215_Dr.%20Mona%20Elharoun,%20Zayed%20City,%20EGY/Hero.png'
    },
    {
      cat: 'Article',
      title: 'Florida Tower Breaks Ground in Miami',
      date: 'January 2024',
      readTime: '4 minute read',
      excerpt: 'Our latest high-rise development begins construction in the heart of Miami\'s financial district, marking a significant milestone for the studio\'s expansion into the Americas.',
      img: 'assets/assets/02_Projects/2514_Florida%20Tower_TNG_Florida,%20USA/Hero.png'
    },
    {
      cat: 'Publication',
      title: 'The Future of Urban Interiors',
      date: 'December 2023',
      readTime: '6 minute read',
      excerpt: 'A reflection on how interior design shapes the urban experience in rapidly growing cities across the Middle East, exploring material culture and spatial intelligence.',
      img: 'assets/assets/02_Projects/2213_Go%20Green%20Office,%20Riyadh,%20KSA/Hero.jpg'
    },
    {
      cat: 'Event',
      title: 'Magg+Partners at Dubai Design Week',
      date: 'November 2023',
      readTime: '3 minute read',
      excerpt: 'We presented our latest research on sustainable materials and passive cooling strategies, drawing significant attention from peers and industry leaders.',
      img: 'assets/assets/02_Projects/2218_Office_HQ,%20Kuwait/Final%202_HERO_01.jpg'
    },
    {
      cat: 'Project',
      title: 'Gazeli Villa Completed in Egypt',
      date: 'September 2023',
      readTime: '4 minute read',
      excerpt: 'The residential villa project in Alamin has been handed over to the client, completing a multi-year design and construction journey on Egypt\'s North Coast.',
      img: 'assets/assets/02_Projects/2311_GAZELI%20Villa,%20Alamin,%20Egypt/03.jpg'
    },
    {
      cat: 'Insight',
      title: 'Designing for the Gulf Climate',
      date: 'July 2023',
      readTime: '7 minute read',
      excerpt: 'How passive design strategies are transforming architecture across the Middle East, reducing energy consumption while enhancing occupant comfort and spatial quality.',
      img: 'assets/assets/02_Projects/2513_StudioOffice_Riyadh,%20KSA/02.jpg'
    },
  ];

  /* ── Render news list ── */
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    const day = d.getDate();
    const suffix = (day === 1 || day === 21 || day === 31) ? 'st'
                 : (day === 2 || day === 22) ? 'nd'
                 : (day === 3 || day === 23) ? 'rd' : 'th';
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${day}${suffix} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }

  function renderNews(items) {
    const list = document.getElementById('newsList');
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<p style="padding:48px 0; color:#aaa; font-size:14px;">No results found.</p>';
      return;
    }
    items.forEach(n => {
      const btnLabel = n.cat === 'Article' ? 'Read Article'
                     : n.cat === 'Publication' ? 'Read Publication'
                     : n.cat === 'Insight' ? 'Read Insight'
                     : 'Read News';
      const a = document.createElement('a');
      a.className = 'news-row';
      a.href = '#';
      a.innerHTML = `
        <div class="news-row-img">
          <img src="${n.img}" alt="${n.title}" loading="lazy">
        </div>
        <div class="news-row-body">
          <div class="news-row-cat">${n.cat}</div>
          <h2 class="news-row-title">${n.title}</h2>
          <div class="news-row-meta">${n.date} · ${n.readTime}</div>
          <p class="news-row-excerpt">${n.excerpt}</p>
          <span class="news-read-btn">${btnLabel}</span>
        </div>
      `;
      addHover(a);
      list.appendChild(a);
    });
  }

  /* ── Filter logic ── */
  function applyFilter() {
    const q    = document.getElementById('newsSearch').value.trim().toLowerCase();
    const type = document.getElementById('newsType').value;
    const filtered = NEWS.filter(n => {
      const matchQ    = !q || n.title.toLowerCase().includes(q) || n.excerpt.toLowerCase().includes(q) || n.cat.toLowerCase().includes(q);
      const matchType = !type || n.cat === type;
      return matchQ && matchType;
    });
    renderNews(filtered);
  }

  document.getElementById('newsSearch').addEventListener('input', applyFilter);
  document.getElementById('newsType').addEventListener('change', applyFilter);

  /* Initial render */
  renderNews(NEWS);

  /* ── Page Loader ── */
  (function () {
    const loader = document.getElementById('page-loader');
    function hideLoader() {
      loader.classList.add('done');
      setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 1100);
    }
    window.addEventListener('load', () => setTimeout(hideLoader, 300));
    setTimeout(hideLoader, 4000);
  })();
  })();
  </script>
