  <!-- ── Hero ── -->
  <section class="pp-hero" id="ppHero">

    <div class="pp-hero-bottom">
      <h1 class="pp-page-title">Projects</h1>
    </div>

  <!-- ── Filter Bar ── -->
  <div class="pp-filter-bar">
    <div class="pp-search-wrap">

      <input type="text" id="ppSearch" class="pp-search" placeholder="Search project">
    </div>
    <div class="pp-select-wrap">
      <select id="ppType" class="pp-select">
        <option value="">Project types</option>
        <option value="architecture">Architecture</option>
        <option value="interiors">Interiors</option>
        <option value="engineering">Engineering</option>
        <option value="urban">Urban &amp; Landscape</option>
        <option value="residential">Residential</option>

      </select>

    </div>
    <div class="pp-select-wrap">

  <!-- ── Contact Us ── -->
  <section class="pp-contact">
    <div class="pp-contact-left">
      <h2 class="pp-contact-h">Contact Us</h2>
    </div>
    <div class="pp-contact-right">
      <form class="pp-form" onsubmit="return false;">
        <input class="pp-input" type="text" placeholder="Name">
        <input class="pp-input" type="email" placeholder="Email">
        <input class="pp-input" type="text" placeholder="Country / Region">
        <input class="pp-input" type="text" placeholder="Interest / Industry">
        <textarea class="pp-input pp-textarea" placeholder="Enquiry details"></textarea>
        <button type="submit" class="pp-submit">Submit</button>
      </form>
    </div>
  </section>

  <!-- ── Newsletter ── -->
  <section id="newsletter">
    <p class="nl-head">Stay up to date with our latest projects and news.</p>
    <form class="nl-form" onsubmit="return false;">
      <input class="nl-input" type="email" placeholder="Email address">
      <button class="nl-btn" type="submit">Subscribe</button>
    </form>
  </section>

  <script src="projects-data.js"></script>
  <script>
    /* ── Cursor ── */
    const dot=document.getElementById('cDot'),ring=document.getElementById('cRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
    document.addEventListener('mousedown',()=>document.body.classList.add('c-click'));
    document.addEventListener('mouseup',()=>document.body.classList.remove('c-click'));
    (function loop(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
    function addHover(el){el.addEventListener('mouseenter',()=>document.body.classList.add('c-hover'));el.addEventListener('mouseleave',()=>document.body.classList.remove('c-hover'));}
    document.querySelectorAll('a,button').forEach(addHover);

    /* ── Nav ── */
    const nav=document.getElementById('nav');
    window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>60),{passive:true});

    /* ── Mobile menu ── */
    const hamBtn=document.getElementById('hamBtn'),mobMenu=document.getElementById('mobMenu');
    let mobOpen=false;
    function closeMob(){mobOpen=false;hamBtn.classList.remove('open');mobMenu.classList.remove('open');document.body.style.overflow='';}
    hamBtn.addEventListener('click',()=>{mobOpen=!mobOpen;hamBtn.classList.toggle('open',mobOpen);mobMenu.classList.toggle('open',mobOpen);document.body.style.overflow=mobOpen?'hidden':'';});
    document.querySelectorAll('.mob-lnk').forEach(a=>a.addEventListener('click',closeMob));

    /* ── Search ── */
    const so=document.getElementById('searchOverlay'),sb=document.getElementById('searchBtn'),sc=document.getElementById('searchClose'),si=document.getElementById('searchInput'),sr=document.getElementById('searchResults');
    function openSearch(){closeMob();so.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>si.focus(),60);renderSearch('');}
    function closeSearch(){so.classList.remove('open');document.body.style.overflow='';si.value='';}
    sb.addEventListener('click',openSearch);sc.addEventListener('click',closeSearch);
    so.addEventListener('click',e=>{if(e.target===so)closeSearch();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}});
    si.addEventListener('input',()=>renderSearch(si.value));
    function renderSearch(q){
      q=q.trim().toLowerCase();sr.innerHTML='';
      const matched=q.length<1?PROJECTS.slice(0,8):PROJECTS.filter(p=>p.name.toLowerCase().includes(q)||p.location.toLowerCase().includes(q)||p.categoryLabel.toLowerCase().includes(q)).slice(0,10);
      if(!matched.length){sr.innerHTML='<p class="search-empty">No results found.</p>';return;}
      const grp=document.createElement('div');grp.className='search-grp';grp.innerHTML='<div class="search-grp-label">Projects</div>';
      matched.forEach(p=>{const a=document.createElement('a');a.className='search-item';a.href='project.html?id='+p.id;a.innerHTML=`<span class="s-name">${p.name}</span><span class="s-meta">${p.location} · ${p.year}</span>`;a.addEventListener('click',closeSearch);addHover(a);grp.appendChild(a);});
      sr.appendChild(grp);
    }

    /* ── Hero carousel ── */
    const HERO_PROJECTS = PROJECTS.slice(0, 6);
    const ppSlides = document.getElementById('ppSlides');
    HERO_PROJECTS.forEach((p, i) => {
      const slide = document.createElement('div');
      slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
      slide.innerHTML = `<img src="${p.hero || p.thumb}" alt="${p.name}" loading="${i === 0 ? 'eager' : 'lazy'}">`;
      ppSlides.appendChild(slide);
    });
    let ppCur = 0, ppTimer = null;
    function ppGoTo(idx){
      const slides = ppSlides.querySelectorAll('.hero-slide');
      slides[ppCur].classList.remove('active');
      ppCur = idx;
      slides[ppCur].classList.add('active');
    }
    function ppNext(){ ppGoTo((ppCur + 1) % HERO_PROJECTS.length); }
    function ppReset(){ clearInterval(ppTimer); ppTimer = setInterval(ppNext, 5000); }
    ppReset();
    let ppPaused = false;
    const ppPause = document.getElementById('ppPause');
    const ppPauseIcon = document.getElementById('ppPauseIcon');
    const P_PAUSE = '<rect x="0" y="0" width="3" height="12"/><rect x="6" y="0" width="3" height="12"/>';
    const P_PLAY = '<polygon points="0,0 10,6 0,12"/>';
    ppPause.addEventListener('click', () => {
      ppPaused = !ppPaused;
      ppPauseIcon.innerHTML = ppPaused ? P_PLAY : P_PAUSE;
      if(ppPaused){ clearInterval(ppTimer); } else { ppReset(); }
    });

    /* ── Location dropdown ── */
    const ppLocSelect = document.getElementById('ppLocation');
    const locs = [...new Set(PROJECTS.map(p => p.location.split(',')[0].trim()))].sort();
    locs.forEach(loc => {
      const opt = document.createElement('option');
      opt.value = loc; opt.textContent = loc;
      ppLocSelect.appendChild(opt);
    });

    /* ── Projects Grid ── */
    const ppGrid = document.getElementById('ppGrid');
    const ppSearch = document.getElementById('ppSearch');
    const ppType = document.getElementById('ppType');

    function renderPPGrid() {
      let list = PROJECTS;
      const q = ppSearch.value.trim().toLowerCase();
      const type = ppType.value;
      const loc = ppLocSelect.value;
      if(q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.location.toLowerCase().includes(q) || p.categoryLabel.toLowerCase().includes(q));
      if(type) list = list.filter(p => p.category === type);
      if(loc) list = list.filter(p => p.location.includes(loc));
      ppGrid.innerHTML = '';
      list.forEach(p => {
        const a = document.createElement('a');
        a.className = 'pstrip-card';
        a.href = 'project.html?id=' + p.id;
        a.innerHTML = `
          <div class="pstrip-card-img"><img src="${p.thumb}" alt="${p.name}" loading="lazy"></div>
          <div class="pstrip-info">
            <div class="pstrip-cat">${p.categoryLabel}</div>
            <div class="pstrip-name">${p.name}</div>
            <div class="pstrip-loc">${p.location} · ${p.year}</div>
          </div>`;
        addHover(a);
        ppGrid.appendChild(a);
      });
    }

    ppSearch.addEventListener('input', renderPPGrid);
    ppType.addEventListener('change', renderPPGrid);
    ppLocSelect.addEventListener('change', renderPPGrid);
    renderPPGrid();

    /* ── Page Loader ── */
    (function(){
      const loader=document.getElementById('page-loader');
      function hideLoader(){loader.classList.add('done');setTimeout(()=>{if(loader.parentNode)loader.parentNode.removeChild(loader);},1100);}
      window.addEventListener('load',()=>{setTimeout(hideLoader,300);});
      setTimeout(hideLoader,4000);
    })();
  </script>
