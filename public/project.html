  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="projects-data.js"></script>
  <script>
  (async function(){
  await loadProjects();
/* scroll-scale observer — defined here, called after images are injected */
const scrollObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      scrollObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });
  /* ── Cursor ── */
  const dot=document.getElementById('cDot'),ring=document.getElementById('cRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  document.addEventListener('mousedown',()=>document.body.classList.add('c-click'));
  document.addEventListener('mouseup',()=>document.body.classList.remove('c-click'));
  (function loop(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
  function addHover(el){el.addEventListener('mouseenter',()=>document.body.classList.add('c-hover'));el.addEventListener('mouseleave',()=>document.body.classList.remove('c-hover'));}
  document.querySelectorAll('a,button').forEach(addHover);

  /* ── Nav ── */
  const nav=document.getElementById('nav');
  window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>60),{passive:true});
  const hamBtn=document.getElementById('hamBtn'),mobMenu=document.getElementById('mobMenu');
  let mobOpen=false;
  function closeMob(){mobOpen=false;hamBtn.classList.remove('open');mobMenu.classList.remove('open');document.body.style.overflow='';}
  hamBtn.addEventListener('click',()=>{mobOpen=!mobOpen;hamBtn.classList.toggle('open',mobOpen);mobMenu.classList.toggle('open',mobOpen);document.body.style.overflow=mobOpen?'hidden':'';});
  document.querySelectorAll('.mob-lnk').forEach(a=>a.addEventListener('click',closeMob));

  /* ── Search ── */
  const so=document.getElementById('searchOverlay'),sb=document.getElementById('searchBtn'),sc=document.getElementById('searchClose'),si=document.getElementById('searchInput'),sr=document.getElementById('searchResults');
  function openSearch(){closeMob();so.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>si.focus(),60);renderSearch('');}
  function closeSearch(){so.classList.remove('open');document.body.style.overflow='';si.value='';}
  sb.addEventListener('click',openSearch);sc.addEventListener('click',closeSearch);
  so.addEventListener('click',e=>{if(e.target===so)closeSearch();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}});
  si.addEventListener('input',()=>renderSearch(si.value));
  function renderSearch(q){
    q=q.trim().toLowerCase();sr.innerHTML='';
    const matched=q.length<1?PROJECTS.slice(0,8):PROJECTS.filter(pp=>pp.name.toLowerCase().includes(q)||pp.location.toLowerCase().includes(q)||pp.categoryLabel.toLowerCase().includes(q)).slice(0,10);
    if(!matched.length){sr.innerHTML='<p class="search-empty">No results found.</p>';return;}
    const grp=document.createElement('div');grp.className='search-grp';grp.innerHTML='<div class="search-grp-label">Projects</div>';
    matched.forEach(pp=>{const a=document.createElement('a');a.className='search-item';a.href='project.html?id='+pp.id;a.innerHTML=`<span class="s-name">${pp.name}</span><span class="s-meta">${pp.location} · ${pp.year}</span>`;a.addEventListener('click',closeSearch);addHover(a);grp.appendChild(a);});
    sr.appendChild(grp);
  }

  /* ── Load Project ── */
  const params=new URLSearchParams(window.location.search);
  const id=params.get('id');
  const idx=PROJECTS.findIndex(pp=>pp.id===id);
  const p=idx!==-1?PROJECTS[idx]:PROJECTS[0];

  document.title=p.name+' — Magg+Partners';

  /* Hero */
document.getElementById('pdHeroBg').style.backgroundImage=`url('${p.hero}')`;
document.getElementById('pdHeroName').textContent=p.name;
document.getElementById('pd-gallery-name').textContent=p.name;

/* Gallery pair — first 2 images */
const imgs=p.gallery&&p.gallery.length?p.gallery:[p.hero];
const pairEl=document.getElementById('pdPair');

if(imgs.length>=2){
  // 1. Define your unique class names in an array
  const classNames = ['pd-image-container1', 'pd-image-container2'];

  [imgs[0],imgs[1]].forEach((src,i)=>{
    const imgWrapper = document.createElement('div');
    
    // 2. Assigns 'con1' to the first div (index 0) and 'cont2' to the second div (index 1)
    imgWrapper.className = classNames[i]; 
    
    const img=document.createElement('img');
    img.src=src; 
    img.alt=p.name+' '+(i+1); 
    img.loading='lazy';
    
    imgWrapper.appendChild(img);
    pairEl.appendChild(imgWrapper);
    scrollObserver.observe(img);
  });
} else {
  pairEl.style.display='none';
}
  /* Overview */
  // document.getElementById('pdOvTitle').textContent=p.name;
  document.getElementById('pdBrief').textContent=p.brief||'';
  const metaItems=[
    {l:'Client         ',    v:p.client||'—'},
    {l:'Expertise      ', v:p.categoryLabel||'—'},
    {l:'Location       ',  v:p.location||'—'},
  ];
  document.getElementById('pdMetaList').innerHTML=metaItems.map(m=>
    `<div class="pd-meta-row"><span class="pd-meta-lbl">${m.l}</span><span class="pd-meta-val">${m.v}</span></div>`
  ).join('');
  document.getElementById('pdMetaList').innerHTML+=
    ` <div class="f-socials-pd ">
  <a class="f-soc" href="https://www.instagram.com/maggdesignforum" aria-label="Instagram" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
  </a>

  <a class="f-soc" href="https://www.facebook.com/share/1BhjxJ5RgC/" aria-label="Facebook" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>
  </a>

  <a class="f-soc" href="https://www.linkedin.com/company/maggdesignforum/" aria-label="LinkedIn" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
  </a>
</div>    `;

  /* Content — facts left */
  const f=p.facts||{};
  const factsItems=[];
  if(p.type) factsItems.push({l:'Project Type',v:p.type});
  if(p.status) factsItems.push({l:'Status',v:p.status});
  if(p.year) factsItems.push({l:'Year',v:p.year});
  if(f.completionYear) factsItems.push({l:'Completion Year',v:f.completionYear});
  if(f.designFinishYear) factsItems.push({l:'Design Finish Year',v:f.designFinishYear});
  if(f.size){
    const s=f.size;
    if(s.siteArea) factsItems.push({l:'Site Area',v:s.siteArea});
    if(s.grossArea) factsItems.push({l:'Gross Area',v:s.grossArea});
    if(s.stories) factsItems.push({l:'Stories',v:s.stories});
  } else if(p.size && p.size!=='—') factsItems.push({l:'Size',v:p.size});
  if(f.sustainability) factsItems.push({l:'Sustainability',v:f.sustainability});

  const factsCol=document.getElementById('pdFactsCol');
  factsCol.innerHTML=factsItems.map(item=>
    `<div class="pd-fact-row"><div class="pd-fact-lbl">${item.l}</div><div class="pd-fact-val">${item.v}</div></div>`
  ).join('');

  /* Collaborators */
  if(f.collaborators&&f.collaborators.length){
    const collabWrap=document.createElement('div');collabWrap.className='pd-fact-row';
    collabWrap.innerHTML=`<div class="pd-fact-lbl">Collaborators</div><div class="pd-fact-val">${f.collaborators.join('<br>')}</div>`;
    factsCol.appendChild(collabWrap);
  }

  /* Content — body right */
  const bodyCol=document.getElementById('pdBodyCol');
  const locationTitle=p.location?p.location.split(',')[0]:'';
  const heading=document.createElement('h2');
  heading.className='pd-body-h';
  heading.textContent=`${p.type||'New Project'} in the heart of ${locationTitle}`;
  bodyCol.appendChild(heading);

  if(p.description){
    const desc=document.createElement('p');
    desc.className='pd-body-p';
    desc.textContent=p.description;
    bodyCol.appendChild(desc);
  }
/* remaining gallery images */
// 🆕 استدعاء الديف الخارجي الجديد اللي هتعمله في الـ HTML
const outerContainer = document.querySelector('.outer-gallery-container');

imgs.slice(2).forEach((src, i) => {

  const wrap = document.createElement('div');

  const img = document.createElement('img');
  img.src = src;
  img.alt = p.name + ' ' + (i + 3);
  img.loading = 'lazy';
  wrap.appendChild(img);

  const cap = document.createElement('div');
  cap.className = 'pd-body-cap';
  
  const baseText = p.name + ' — ' + p.location + ', ' + p.year;
  cap.innerHTML = `${baseText} <span class="custom-copyright">© Magg + Partners</span>`;
  
  wrap.appendChild(cap);

  // ── التعديل السحري هنا ──
  // لو وصلنا لآخر عنصر في الـ Array (الصورة الأخيرة)
  if (i === imgs.length - 3) {
    
    wrap.className = 'last-gallery-img-2'; // الكلاس الخاص بالصورة الأخيرة
    
    // 🆕 هنا بندخل الصورة الأخيرة جوه الديف الخارجي تماماً بره الأب القديم
    if (outerContainer) {
      outerContainer.appendChild(wrap); 
    } else {
      // حل احتياطي لو نسيت تضيف الديف في الـ HTML عشان الكود ميعطلش
      bodyCol.after(wrap); 
    }
    
  } else {
    
    wrap.className = 'pd-body-img'; // باقي الصور بتاخد الكلاس المعتاد
    bodyCol.appendChild(wrap); // وبتدخل جوه الـ bodyCol الطبيعي
    
  }

});

  /* More Projects */
  const moreGrid=document.getElementById('pdMoreGrid');
  const others=PROJECTS.filter(pp=>pp.id!==p.id);
  const sameCat=others.filter(pp=>pp.category===p.category);
  const picks=[...sameCat,...others.filter(pp=>pp.category!==p.category)].slice(0,4);
  picks.forEach(pp=>{
    const a=document.createElement('a');a.className='pd-more-card';a.href='project.html?id='+pp.id;
    a.innerHTML=`
      <div class="pd-more-img"><img src="${pp.thumb}" alt="${pp.name}" loading="lazy"></div>
      <div class="pd-more-info">
        <div class="pd-more-cat">${pp.categoryLabel}</div>
        <div class="pd-more-name">${pp.name}</div>
        <div class="pd-more-loc">${pp.location}</div>
      </div>`;
    addHover(a);moreGrid.appendChild(a);
  });

  /* ── Newsletter ── */
  const nlForm = document.getElementById('nlForm');
  if (nlForm) {
    nlForm.addEventListener('submit', async e => {
      e.preventDefault();
      const emailInput = document.getElementById('nlEmail');
      const email = emailInput.value.trim();
      if (!email) return;
      try {
        await subscribeToNewsletter(email);
        emailInput.value = '';
        emailInput.placeholder = 'Subscribed — thank you!';
      } catch (err) {
        console.error('Newsletter subscribe failed:', err.message);
      }
    });
  }

  /* ── Page Loader ── */
  (function(){
    const loader=document.getElementById('page-loader');
    function hideLoader(){loader.classList.add('done');setTimeout(()=>{if(loader.parentNode)loader.parentNode.removeChild(loader);},1100);}
    window.addEventListener('load',()=>{setTimeout(hideLoader,300);});
    setTimeout(hideLoader,4000);
  })();
  })();
  </script>

</body>
